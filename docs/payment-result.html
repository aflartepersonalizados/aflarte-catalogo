<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento | AFLarte</title><link rel="icon" href="assets/logo.webp"><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f8f7f8;color:#342d3c;margin:0;display:grid;min-height:100vh;place-items:center}.card{width:min(520px,calc(100% - 32px));background:white;border-radius:24px;padding:32px;box-shadow:0 18px 55px #342d3c1a;text-align:center}.logo{width:120px}.status{font-size:52px;margin:14px}.card h1{margin:6px 0}.card p{line-height:1.55;color:#675d6b}.btn{display:inline-block;margin-top:14px;padding:13px 22px;border-radius:999px;background:#342d3c;color:white;text-decoration:none;font-weight:800}</style></head><body><main class="card"><img class="logo" src="assets/logo.webp" alt="AFLarte"><div id="icon" class="status">⏳</div><h1 id="title">Verificando seu pagamento</h1><p id="text">A confirmação definitiva é feita pelo Mercado Pago diretamente com a AFLarte. Não feche esta página se ainda estiver aguardando o resultado.</p><p id="order"></p><a class="btn" href="./">Voltar para a loja</a></main><script>const p=new URLSearchParams(location.search),r=p.get('result'),o=p.get('order')||'';document.getElementById('order').textContent=o?'Pedido: '+o:'';const map={success:['✓','Pagamento enviado','Recebemos o retorno do Mercado Pago. A AFLarte considerará o pedido pago somente após a confirmação segura do pagamento pelo servidor.'],pending:['⏳','Pagamento pendente','Seu pagamento ainda está aguardando confirmação. Assim que o Mercado Pago confirmar, o pedido seguirá automaticamente para a produção.'],failure:['!','Pagamento não concluído','O pagamento foi cancelado ou não pôde ser concluído. Seu pedido não será enviado para produção como pago.']};if(map[r]){document.getElementById('icon').textContent=map[r][0];document.getElementById('title').textContent=map[r][1];document.getElementById('text').textContent=map[r][2]}</script></body></html>
